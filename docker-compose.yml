services:
  db:
    image: postgres:16-alpine
    container_name: buildshop_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-buildshop}
      POSTGRES_USER: ${POSTGRES_USER:-buildshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-buildshop_secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-buildshop} -d ${POSTGRES_DB:-buildshop}"]
      interval: 3s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  web:
    build: .
    container_name: buildshop_web
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_demo &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-demo-buildshop-secret-key-2026}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      POSTGRES_DB: ${POSTGRES_DB:-buildshop}
      POSTGRES_USER: ${POSTGRES_USER:-buildshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-buildshop_secret}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CHECKO_API_KEY: ${CHECKO_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
